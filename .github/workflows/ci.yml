# FACEATTEND CI — MARP readiness + AC-2 chaos fault-injection on every commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  COMPOSE_PROJECT_DIR: .
  BASE_URL: http://localhost:8000

jobs:
  build-and-test:
    name: Build & Test (MARP + chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the docker-compose stack
        run: docker compose build

      - name: Start stack in background
        run: docker compose up -d
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Wait for database healthy
        run: |
          for i in $(seq 1 24); do
            if docker compose ps db --format json | grep -q '"Health":"Healthy"'; then
              echo "db healthy"; break
            fi
            docker compose ps; sleep 5
          done
          docker compose ps db --format json | grep -q '"Health":"Healthy"'

      - name: Wait for MARP READY (200) — proves VRAM warmup
        run: |
          for i in $(seq 1 36); do
            CODE=$(curl -s -o /tmp/ready.json -w "%{http_code}" http://localhost:8000/api/v1/marp/healthz/readiness || echo 000)
            echo "attempt $i -> HTTP $CODE"
            cat /tmp/ready.json || true; echo
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "MARP never reached READY"; exit 1

      - name: Execute AC-2 fault-injection (503 + DB drop recovery)
        run: python tests/fault_injection.py --project-dir . --base-url http://localhost:8000 --json fault_report.json --csv fault_samples.csv

      - name: Upload fault-injection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac2-fault-report
          path: |
            fault_report.json
            fault_samples.csv

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down stack
        if: always()
        run: docker compose down -v

