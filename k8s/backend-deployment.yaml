# FACEATTEND backend — ConfigMap (non-sensitive) + Secret (sensitive) + Deployment.
# MARP integration: K8s probes hit the MARP engine directly so no camera
# traffic is routed before YOLOv8/MediaPipe weights are in VRAM (READY 200).
apiVersion: v1
kind: ConfigMap
metadata:
  name: faceattend-backend-config
  labels:
    app: faceattend-backend
data:
  MODEL_LOAD_SECONDS: "15"
  YOLO_WEIGHTS: "yolov8n-face.pt"
  FACE_BACKEND_ORDER: "yolo,mediapipe,haar"
  REID_THRESHOLD: "0.85"
  ADMIN_USER: "admin"
  ADMIN_EMAIL: "admin@college.edu"
---
apiVersion: v1
kind: Secret
metadata:
  name: faceattend-backend-secret
  labels:
    app: faceattend-backend
type: Opaque
stringData:
  # Overridden at deploy time: kubectl create secret ... --from-literal=...
  # or external-secrets. Defaults below are DEV ONLY.
  JWT_SECRET: "faceattend-dev-secret-change-in-prod-32chars!"
  DATABASE_URL: "postgresql://analytics:analytics@postgres:5432/analytics"
  ADMIN_PASSWORD: "admin123"
  POSTGRES_PASSWORD: "analytics"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faceattend-backend
  labels:
    app: faceattend-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: faceattend-backend
  template:
    metadata:
      labels:
        app: faceattend-backend
    spec:
      containers:
        - name: faceattend-backend
          image: ghcr.io/faceattend/backend:latest # pre-warmed YOLOv8 image from CI
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MODEL_LOAD_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: faceattend-backend-config
                  key: MODEL_LOAD_SECONDS
            - name: YOLO_WEIGHTS
              valueFrom:
                configMapKeyRef:
                  name: faceattend-backend-config
                  key: YOLO_WEIGHTS
            - name: FACE_BACKEND_ORDER
              valueFrom:
                configMapKeyRef:
                  name: faceattend-backend-config
                  key: FACE_BACKEND_ORDER
            - name: ADMIN_USER
              valueFrom:
                configMapKeyRef:
                  name: faceattend-backend-config
                  key: ADMIN_USER
            - name: ADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: faceattend-backend-config
                  key: ADMIN_EMAIL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: faceattend-backend-secret
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: faceattend-backend-secret
                  key: DATABASE_URL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: faceattend-backend-secret
                  key: ADMIN_PASSWORD
          # Liveness = process alive (MARP liveness endpoint, cheap).
          livenessProbe:
            httpGet:
              path: /api/v1/marp/healthz/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness = MARP READY (weights in VRAM + DB verified).
          # Returns 503 while UNINITIALIZED/LOADING_WEIGHTS (~24s for
          # MediaPipe/YOLOv8 warmup), 200 only at READY — K8s holds
          # Endpoints until then, so no camera traffic hits a cold model.
          readinessProbe:
            httpGet:
              path: /api/v1/marp/healthz/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
