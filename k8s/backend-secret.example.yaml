# FACEATTEND backend Secret — EXAMPLE ONLY (placeholders, safe to commit).
#
# The real Secret is NEVER committed. Create it outside source control:
#
#   kubectl create secret generic faceattend-backend-secret \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL="postgresql://analytics:<DB_PASSWORD>@postgres:5432/analytics" \
#     --from-literal=ADMIN_PASSWORD='<strong password, at least 12 chars>' \
#     --from-literal=POSTGRES_PASSWORD='<strong database password>'
#
# Or copy this file to `k8s/backend-secret.yaml` (git-ignored), replace every
# REPLACE_ME value, and `kubectl apply -f k8s/backend-secret.yaml`.
#
# Behavior notes:
# - The Deployment's secretKeyRefs are required: a missing Secret or a
#   missing key blocks pod creation with a clear Kubernetes event.
# - Empty or weak values still fail the application's own startup validation
#   (backend/app/core/config.py), so the pod will CrashLoop with an explicit
#   "Refusing to start" message instead of running insecurely.
apiVersion: v1
kind: Secret
metadata:
  name: faceattend-backend-secret
  labels:
    app: faceattend-backend
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_32_PLUS_RANDOM_CHARS"
  DATABASE_URL: "REPLACE_ME_postgresql://USER:PASSWORD@HOST:5432/DB"
  ADMIN_PASSWORD: "REPLACE_ME_MIN_12_CHARS"
  POSTGRES_PASSWORD: "REPLACE_ME_STRONG_DB_PASSWORD"
