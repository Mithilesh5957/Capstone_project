# FACEATTEND services — backend ClusterIP (:8000), frontend LoadBalancer (:80).
apiVersion: v1
kind: Service
metadata:
  name: faceattend-backend
  labels:
    app: faceattend-backend
spec:
  type: ClusterIP
  selector:
    app: faceattend-backend
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: faceattend-frontend
  labels:
    app: faceattend-frontend
spec:
  type: LoadBalancer
  selector:
    app: faceattend-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
