services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      # Explicit DB health check
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://analytics:analytics@db:5432/analytics
      MODEL_LOAD_SECONDS: 15
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Healthy only when model weights are loaded AND db is verified
      # (mirrors backend/main.py: /healthz/readiness returns 503 while loading, 200 when ready)
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
